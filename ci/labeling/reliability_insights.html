<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JFrog CI · insights review</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --ink: #1d2330; --muted: #667085; --line: #e3e6eb;
    --accent: #2f6fdf; --accent-soft: #e8f0fd; --gray-soft: #eef0f3; --code: #f1f2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181d; --card: #1f2229; --ink: #e6e8ec; --muted: #9aa1ad; --line: #343843;
            --accent: #7aa7f5; --accent-soft: #24324a; --gray-soft: #2a2e37; --code: #272a33; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 20px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; max-width: 1280px; margin: 0 auto; }
  h1 { font-size: 16px; margin: 0; font-weight: 650; } h1 span { color: var(--muted); font-weight: 500; }
  a { color: var(--accent); }
  select, input[type=text], textarea { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); }
  button { font: inherit; padding: 3px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); cursor: pointer; }
  button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .chip { background: var(--gray-soft); border-radius: 999px; padding: 2px 9px; white-space: nowrap; font-size: 12.5px; }
  .muted { color: var(--muted); }
  .intro { max-width: 1280px; margin: 6px auto 0; font-size: 12.5px; color: var(--muted); }
  .banner { max-width: 1280px; margin: 8px auto 0; padding: 8px 12px; border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 6px; }
  .banner[hidden] { display: none; }
  main { max-width: 1280px; margin: 14px auto 60px; padding: 0 20px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .card h2 { font-size: 15px; margin: 0 0 2px; font-weight: 620; }
  .card .sub { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  col.f { width: 17%; } col.v { width: 49%; } col.m { width: 14%; } col.n { width: 20%; }
  th, td { border: 1px solid var(--line); padding: 6px 8px; vertical-align: top; text-align: left; overflow-wrap: anywhere; }
  thead th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  tbody th { font-weight: 600; font-size: 13px; }
  .val { white-space: pre-wrap; }
  .none { color: var(--muted); font-style: italic; }
  .marks { display: flex; gap: 4px; flex-wrap: wrap; }
  td.note textarea { width: 100%; min-height: 2.2em; resize: vertical; }
  .saved { font-size: 11px; color: var(--muted); display: block; margin-top: 3px; min-height: 1em; }
  .tlabel { font-size: 12px; color: var(--muted); margin-top: 8px; }
  pre { white-space: pre-wrap; word-break: break-word; background: var(--code); padding: 8px; border-radius: 4px;
        font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; max-height: 340px; overflow: auto; margin: 4px 0; }
  @media (max-width: 800px) {
    table, tbody, tr, th, td { display: block; width: 100%; } thead, colgroup { display: none; }
    tbody tr { border-bottom: 2px solid var(--line); padding: 4px 0; }
  }
  .claim { border-top: 1px dashed var(--line); margin-top: 12px; padding-top: 10px; }
  .claim h3 { font-size: 14px; margin: 0 0 6px; font-weight: 620; }
  ul.cited { margin: 4px 0 8px 18px; padding: 0; } ul.cited li { margin: 2px 0; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>JFrog CI <span>· insights review</span></h1>
    <label>Run <select id="run"></select></label>
    <span class="chip" id="progress"></span>
    <span class="chip" id="status">loading…</span>
    <a href="#" id="export" download>Export marks (JSON)</a>
    <a href="/reliability">Item sheet</a>
  </div>
  <div class="intro" id="intro"></div>
</header>
<main id="items"></main>
<script>
(function () {
  "use strict";
  var state = {run: null, data: null, marks: {}};
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "text") e.textContent = attrs[k]; else if (k === "cls") e.className = attrs[k]; else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }
  function getJSON(url) {
    return fetch(url).then(function (r) { if (!r.ok) throw new Error(url + ": HTTP " + r.status); return r.json(); });
  }
  function markOf(t, key) { return ((state.marks[t] || {})[key]) || {mark: null, note: ""}; }
  function progress() {
    var total = 0, done = 0;
    Object.keys(state.data.targets).forEach(function (t) {
      state.data.targets[t].forEach(function (f) { total++; if (markOf(t, f).mark) done++; });
    });
    $("progress").textContent = done + " of " + total + " fields marked";
  }

  // Marks wait in this browser until the server confirms them, and are retried (same as the item sheet).
  var savedEls = {}, retryTimer = null, flushing = false;
  function pendingKey() { return "reliability_insights_pending_" + state.run; }
  function readPending() { try { return JSON.parse(localStorage.getItem(pendingKey()) || "{}") || {}; } catch (e) { return {}; } }
  function writePending(p) { try { localStorage.setItem(pendingKey(), JSON.stringify(p)); } catch (e) { /* storage blocked */ } }
  function showPending(err) {
    var n = Object.keys(readPending()).length;
    $("status").textContent = n ? n + " change" + (n === 1 ? "" : "s") + " NOT on the server yet (kept in this browser, retrying)" +
      (err ? ": " + err : "") : "all changes saved on the server";
  }
  function scheduleRetry() { if (!retryTimer) retryTimer = setTimeout(function () { retryTimer = null; flushPending(); }, 5000); }
  function flushPending() {
    if (flushing) return;
    var p = readPending(), keys = Object.keys(p);
    if (!keys.length) { showPending(); return; }
    flushing = true;
    var chain = Promise.resolve(), run = state.run;
    keys.forEach(function (k) {
      chain = chain.then(function () {
        var v = p[k], cut = k.lastIndexOf("|"), target = k.slice(0, cut), key = k.slice(cut + 1);
        return fetch("/api/reliability-insights/" + encodeURIComponent(run) + "/marks", {
          method: "PUT", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({target: target, field: key, mark: v.mark, note: v.note})
        }).then(function (r) {
          if (!r.ok) return r.text().then(function (t) { throw new Error("HTTP " + r.status + " " + t); });
          return r.json();
        }).then(function (saved) {
          var now = readPending();
          if (now[k] && now[k].mark === v.mark && now[k].note === v.note) { delete now[k]; writePending(now); }
          (state.marks[target] = state.marks[target] || {})[key] = saved;
          if (savedEls[k]) savedEls[k].textContent = "saved " + new Date(saved.at).toLocaleTimeString();
        });
      });
    });
    chain.then(function () { flushing = false; progress(); if (Object.keys(readPending()).length) flushPending(); else showPending(); })
         .catch(function (e) {
           flushing = false;
           keys.forEach(function (k) { if (readPending()[k] && savedEls[k]) savedEls[k].textContent = "not saved yet, retrying"; });
           showPending(e.message); scheduleRetry();
         });
  }
  function save(target, key, mark, note, savedEl) {
    var k = target + "|" + key, p = readPending();
    p[k] = {mark: mark, note: note}; writePending(p); savedEls[k] = savedEl;
    (state.marks[target] = state.marks[target] || {})[key] = {mark: mark, note: note};
    savedEl.textContent = "saving…"; progress(); flushPending();
  }
  window.addEventListener("beforeunload", function (e) {
    if (state.run && Object.keys(readPending()).length) { e.preventDefault(); e.returnValue = ""; }
  });
  window.addEventListener("online", function () { flushPending(); });

  function markCells(target, key) {
    var cur = markOf(target, key), k = target + "|" + key;
    var saved = el("span", {cls: "saved", text: readPending()[k] ? "not saved yet, retrying" :
      cur.at ? "saved " + new Date(cur.at).toLocaleTimeString() : ""});
    savedEls[k] = saved;
    var td = el("td", {cls: "mark"}), box = el("div", {cls: "marks"});
    var noteBox = el("textarea", {rows: "1", "aria-label": "Note"});
    noteBox.value = cur.note || "";
    ["right", "wrong"].forEach(function (m) {
      var b = el("button", {type: "button", text: m === "right" ? "Right" : "Wrong", "aria-pressed": String(cur.mark === m)});
      if (cur.mark === m) b.classList.add("on");
      b.addEventListener("click", function () {
        var next = markOf(target, key).mark === m ? null : m;  // a second click clears the mark
        box.querySelectorAll("button").forEach(function (x) { x.classList.remove("on"); x.setAttribute("aria-pressed", "false"); });
        if (next) { b.classList.add("on"); b.setAttribute("aria-pressed", "true"); }
        save(target, key, next, noteBox.value, saved);
      });
      box.appendChild(b);
    });
    var timer = null;
    function flush() {
      clearTimeout(timer); timer = null;
      if (noteBox.value.trim() !== (markOf(target, key).note || "")) save(target, key, markOf(target, key).mark, noteBox.value, saved);
    }
    noteBox.addEventListener("input", function () { clearTimeout(timer); timer = setTimeout(flush, 800); });
    noteBox.addEventListener("blur", flush);
    td.appendChild(box); td.appendChild(saved);
    return [td, el("td", {cls: "note"}, [noteBox])];
  }
  function table(rows) {
    return el("table", {}, [
      el("colgroup", {}, [el("col", {cls: "f"}), el("col", {cls: "v"}), el("col", {cls: "m"}), el("col", {cls: "n"})]),
      el("thead", {}, [el("tr", {}, [el("th", {text: "Field"}), el("th", {text: "Value"}), el("th", {text: "Right / wrong"}), el("th", {text: "Note"})])]),
      el("tbody", {}, rows)]);
  }
  function row(target, key, label, valueNode) {
    var cells = markCells(target, key);
    var v = el("td", {cls: "val"}); v.appendChild(valueNode);
    return el("tr", {"data-field": key}, [el("th", {text: label}), v, cells[0], cells[1]]);
  }
  function text(v) { return v ? document.createTextNode(String(v)) : el("span", {cls: "none", text: "(none)"}); }
  function citedNode(cl) {
    var wrap = el("div", {});
    var ul = el("ul", {cls: "cited"});
    cl.items.forEach(function (it) {
      var li = el("li", {});
      if (it.missing) { li.appendChild(el("span", {cls: "none", text: it.id + ": not in the store"})); ul.appendChild(li); return; }
      li.appendChild(el("a", {href: it.url, target: "_blank", rel: "noopener noreferrer", text: it.title}));
      li.appendChild(document.createTextNode(" · score " + (it.score == null ? "none" : it.score) + " · " +
        (it.competitor || "?") + " · " + (it.category || "?") + " · " + (it.publisher || it.source) + " · " +
        String(it.published_at || "").slice(0, 10) + " · " + it.id + (it.quote_here ? " · the quote is from this item" : "")));
      ul.appendChild(li);
    });
    wrap.appendChild(ul);
    return wrap;
  }
  function quoteNode(cl) {
    var wrap = el("div", {});
    wrap.appendChild(el("pre", {text: cl.quote || ""}));
    var src = cl.items.filter(function (x) { return x.id === cl.quote_item_id; })[0] || state.data.cited[cl.quote_item_id];
    if (src && !src.missing) {
      var d = el("details", {});
      d.appendChild(el("summary", {text: "Title and the first " + (src.text_seen || "").length + " of " + src.text_chars +
        " characters of " + cl.quote_item_id + " (what the generator saw)"}));
      d.appendChild(el("pre", {text: src.title + "\n\n" + (src.text_seen || "")}));
      wrap.appendChild(d);
    }
    return wrap;
  }
  function render() {
    var d = state.data, main = $("items");
    main.textContent = "";
    var src = d.source;
    $("intro").textContent = "Run " + d.run_id + " · Brief " + d.brief_date + " · " + d.insights.length + " insights, " +
      d.insights.reduce(function (n, x) { return n + x.claims.length; }, 0) + " claims, exactly as stored (generated " +
      src.generated_at + ", fingerprint " + src.fingerprint + ", " + src.model + "; stored row sha256 " + src.data_sha256.slice(0, 12) +
      "). Rejected by the code checks: " + d.rejected.length + ". Each click or note is saved on the server; a second click clears a mark.";
    $("export").href = "/api/reliability-insights/" + encodeURIComponent(d.run_id) + "/export";
    $("export").setAttribute("download", "insights_marks_" + d.run_id + ".json");
    d.insights.forEach(function (ins, n) {
      var card = el("section", {cls: "card", id: ins.id});
      card.appendChild(el("h2", {text: (n + 1) + ". " + ins.title}));
      card.appendChild(el("div", {cls: "sub", text: ins.pattern + " · " + ins.id}));
      card.appendChild(table(ins.fields.map(function (f) { return row(ins.id, f.key, f.label, text(f.value)); })));
      ins.claims.forEach(function (cl) {
        var box = el("div", {cls: "claim", id: cl.id});
        box.appendChild(el("h3", {text: "Claim " + cl.n + ": " + cl.text}));
        var rows = cl.fields.map(function (f) {
          var v = f.key === "claim" ? text(cl.text) : f.key === "cited" ? citedNode(cl) :
                  f.key === "quote" ? quoteNode(cl) : el("pre", {text: cl.jfrog_quote});
          return row(cl.id, f.key, f.label, v);
        });
        box.appendChild(table(rows));
        card.appendChild(box);
      });
      main.appendChild(card);
    });
    progress();
  }
  function load(run) {
    state.run = run; $("status").textContent = "loading…";
    getJSON("/api/reliability-insights/" + encodeURIComponent(run)).then(function (d) {
      state.data = d; state.data.cited = {}; state.marks = d.marks || {};
      var p = readPending();
      Object.keys(p).forEach(function (k) {
        var cut = k.lastIndexOf("|"), t = k.slice(0, cut), f = k.slice(cut + 1);
        (state.marks[t] = state.marks[t] || {})[f] = {mark: p[k].mark, note: p[k].note};
      });
      render(); flushPending();
    }).catch(function (e) { $("status").textContent = "could not load: " + e.message; });
  }
  getJSON("/api/reliability-insights").then(function (m) {
    var sel = $("run");
    m.runs.forEach(function (r) { sel.appendChild(el("option", {value: r, text: r})); });
    sel.addEventListener("change", function () { load(sel.value); });
    if (m.runs.length) load(m.runs[0]); else $("status").textContent = "no insights export in output/reviews";
  }).catch(function (e) { $("status").textContent = "could not load: " + e.message; });
})();
</script>
</body>
</html>
