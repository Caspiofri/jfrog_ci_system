# Lint gate: `ruff check` from the repo root. Covers the CI tool code (ci/, tests/ci) and the old newsletter files
# once the migration has touched them; the rest of the old code joins the list as it is edited.
target-version = "py311"
line-length = 120
include = [
    "ci/**/*.py",
    "tests/ci/**/*.py",
    "config/settings.py",
    "evals/rank_eval.py",
    "main.py",
    "modules/article_store.py",
    "modules/graph.py",
    "modules/judge_llm.py",
    "modules/link_utils.py",
    "modules/llm_clients.py",
    "modules/nodes.py",
    "modules/state.py",
    "modules/tracing.py",
    "tests/test_collectors.py",
    "tests/test_env_example.py",
    "tests/test_imports.py",
    "tests/test_judge_llm.py",
    "tests/test_link_utils.py",
    "tests/test_pipeline_evidence.py",
    "tests/test_source_isolation.py",
    "tests/test_tracing.py",
    "tests/test_llm_clients.py",
    "tests/test_llm_usage.py",
    "tests/test_main_run.py",
    "tests/test_summarize_ids.py",
]

[lint]
select = ["E", "F", "I", "UP", "B"]
