# Coverage ground truth: real competitor events of 16-30 Oct 2026, curated by hand from OFFICIAL sources only
# (vendor changelogs, blogs, docs release notes, and for the Industry channel the project's own advisory or CISA).
# Read by ci/coverage.py, which reports how many of these a collection run captured (coverage recall).
#
# Per event:
#   competitor           key from config/competitors.yaml (or "industry")
#   date                 the official publication date (YYYY-MM-DD)
#   category             one of the 7 D11 categories
#   expected_importance  1-5 per rubric v2 (config/rubric_v2.md), with `why`
#   event_type           new_capability | ga_of_existing | improvement | regional_expansion | pricing_packaging |
#                        acquisition_funding_partnership | security_incident | vulnerability_fix | deprecation | marketing
#   match.urls           extra URLs that count as the same event (official_url always counts)
#   match.title_keywords keyword groups; an item matches when its TITLE contains ALL keywords of ANY one group,
#                        case-insensitive, on word boundaries. A trailing * matches a word prefix ("exploit*"
#                        matches "exploited"). Keep groups specific enough to miss unrelated items.
#   verified             what was fetched to confirm the event and its date
#
# Curated on 30 Oct 2026. Coverage checked for every competitor; findings per competitor:
#   aws (was aws_codeartifact): no CodeArtifact announcement in the window (What's New feed, CodeArtifact docs, search). The
#     AWS event below is Amazon Inspector (the AWS Nitro blog post was removed on 30 Oct: a blog post, not an event).
#   sonatype: the only press release near the window, Nexus Repository Pro+ (14 Oct), predates it and is left out.
#     One official event remains, the eMudhra assessment.
# Left out on purpose: news without an official page (GitLab's India office, reported only by press); the AOMEI
# supply-chain attack (disclosed 15 Oct, before the range); Snyk's Evo Agentic AppSec launch (15 Oct, before it).

